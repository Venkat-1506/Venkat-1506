<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Venkatasaarathy R — Computer Science Student and Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d17"/>
      <stop offset="0.5" stop-color="#0d1f38"/>
      <stop offset="1" stop-color="#080d17"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f81f7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2f81f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2f81f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e3a5f" stroke-width="1" opacity="0.35"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="1010" cy="110" r="180" fill="url(#glow)"/>
  <circle cx="1010" cy="110" r="130" fill="#2f81f7" opacity="0.10" filter="url(#soft)"/>
  <circle cx="1120" cy="260" r="80" fill="#22d3ee" opacity="0.08" filter="url(#soft)"/>

  <g stroke="url(#accent)" stroke-width="1.5" opacity="0.55" fill="none">
    <path d="M840 220 L900 180 L960 210 L1030 150 L1100 190"/>
    <path d="M900 180 L920 250 L980 275 L1030 230"/>
  </g>
  <g fill="#7dd3fc">
    <circle cx="840" cy="220" r="4"/>
    <circle cx="900" cy="180" r="4"/>
    <circle cx="960" cy="210" r="4"/>
    <circle cx="1030" cy="150" r="4"/>
    <circle cx="1100" cy="190" r="4"/>
    <circle cx="920" cy="250" r="3"/>
    <circle cx="980" cy="275" r="3"/>
    <circle cx="1030" cy="230" r="3"/>
  </g>

  <g>
    <circle cx="990" cy="130" r="92" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.8"/>
    <circle cx="990" cy="130" r="104" fill="none" stroke="#2f81f7" stroke-width="1" opacity="0.25"/>
    <text x="990" y="154" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700" fill="#e8f1ff">VR</text>
  </g>

  <text x="80" y="128" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff">Venkatasaarathy R</text>
  <text x="82" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#9ec5ff">Computer Science Student · Full-Stack Developer</text>
  <text x="82" y="208" font-family="Consolas, Menlo, monospace" font-size="17" fill="#7dd3fc">React · Vite · Python · Java · SQL</text>

  <rect x="82" y="230" width="306" height="34" rx="17" fill="#0f2a4a" stroke="#2f81f7" stroke-width="1.2" opacity="0.95"/>
  <circle cx="102" cy="247" r="4.5" fill="#22d3ee"/>
  <text x="116" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#cfe6ff">Open to internships &amp; collaborations</text>

  <rect x="80" y="288" width="120" height="3" rx="1.5" fill="url(#accent)"/>
